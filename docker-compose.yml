version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: eventchain
      POSTGRES_USER: eventchain
      POSTGRES_PASSWORD: changeme
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    command: gunicorn eventchain_backend.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - 8000:8000
    depends_on:
      - db

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
    ports:
      - 3000:3000
    environment:
      - NODE_ENV=development

volumes:
  db_data:
